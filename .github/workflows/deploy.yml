name: Webapp publiceren

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Ruwe antwoorden van de Pages-API bijhouden terwijl deploy-pages loopt (de actie toont enkel "Current status: …").
      # Achtergrondproces: elke 15 s GET pages/deployments/<commit> naar een logbestand; de laatste stap toont alles.
      - name: Pages-API volgen (achtergrond)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nohup bash -c '
            for i in $(seq 1 120); do
              echo "=== $(date -u +%H:%M:%S) GET /repos/$GITHUB_REPOSITORY/pages/deployments/$GITHUB_SHA"
              curl -sS -i -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/deployments/$GITHUB_SHA"
              echo
              sleep 15
            done' > "$RUNNER_TEMP/pages-raw.log" 2>&1 &
          echo "logboek: $RUNNER_TEMP/pages-raw.log"
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Ruwe antwoorden van GitHub Pages
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api() { curl -sS -i -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/$1"; echo; }
          echo "##### Verloop tijdens de deploy (pages/deployments/$GITHUB_SHA, elke 15 s)"
          cat "$RUNNER_TEMP/pages-raw.log" || echo "(geen logboek)"
          echo "##### Nu: pages/deployments/$GITHUB_SHA"; api "pages/deployments/$GITHUB_SHA"
          echo "##### Pages-instellingen (pages)"; api "pages"
          echo "##### Laatste builds (pages/builds?per_page=3)"; api "pages/builds?per_page=3"
          echo "##### Laatste deployments van github-pages"; api "deployments?environment=github-pages&per_page=3"
