name: Webapp publiceren

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reserveweg:
        description: "Test: publiceren enkel via de reserveweg (zonder deploy-pages)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Eén publicatie tegelijk. Een lopende publicatie NOOIT afbreken (zoals GitHubs eigen Pages-voorbeeld):
# een afgebroken Pages-deploy blijft bij GitHub soms "in progress" hangen en blokkeert dan elke volgende
# ("Please cancel <commit> first"). Tussenliggende runs die nog wachten, vallen wel weg; de nieuwste blijft.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Schermtest (7 nov 2026): elke pagina met verzonnen gegevens openen; bij een fout of wit scherm wordt er niet gepubliceerd.
      - name: Schermtest
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          node tests/smoke.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || 'https://app.vonstruct.com/' }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Ruwe antwoorden van de Pages-API bijhouden terwijl deploy-pages loopt (de actie toont enkel "Current status: …").
      - name: Pages-API volgen (achtergrond)
        run: |
          nohup bash -c '
            for i in $(seq 1 120); do
              echo "=== $(date -u +%H:%M:%S) GET /repos/$GITHUB_REPOSITORY/pages/deployments/$GITHUB_SHA"
              curl -sS -i -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/deployments/$GITHUB_SHA"
              echo
              sleep 15
            done' > "$RUNNER_TEMP/pages-raw.log" 2>&1 &
          echo "logboek: $RUNNER_TEMP/pages-raw.log"

      # Enkel tonen (niets afbreken): de Pages-status van de deploys van de laatste 3 uur. Een vorige, al
      # gepubliceerde versie staat soms nog even op purging_cdn; die afbreken is niet nodig. Een échte blokkade
      # ("Please cancel <commit> first") breekt de reserveweg hieronder gericht af.
      - name: Vorige Pages-deploys (status)
        run: |
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          H=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          since=$(date -u -d '-3 hours' +%Y-%m-%dT%H:%M:%SZ)
          for ver in $(curl -sS "${H[@]}" "$API/deployments?environment=github-pages&per_page=20" | jq -r --arg s "$since" '.[] | select(.created_at > $s) | .sha' | sort -u); do
            echo "$ver: $(curl -sS "${H[@]}" "$API/pages/deployments/$ver" | jq -c .)"
          done

      - id: deployment
        if: ${{ !inputs.reserveweg }}
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 900000

      # Reserveweg als deploy-pages faalt omdat een vorige deploy bij GitHub nog "bezig" staat (400 "Please cancel <commit> first"):
      # die deploy gericht afbreken en elke minuut opnieuw proberen, tot 25 minuten. Getest 5 nov 2026: het versienummer moet de
      # commit zelf zijn (een eigen versienummer geeft 404). Is de deploy van deze commit zelf al afgebroken (time-out), dan kan
      # dezelfde commit niet opnieuw: een nieuwe wijziging (of een lege commit) publiceert dan wel.
      - name: Opnieuw proberen (reserveweg)
        if: steps.deployment.outcome == 'failure' || inputs.reserveweg
        run: |
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          H=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/json")
          art=$(curl -sS "${H[@]}" "$API/actions/runs/$GITHUB_RUN_ID/artifacts" | jq -r '.artifacts[] | select(.name=="github-pages") | .id' | head -1)
          echo "artefact github-pages: $art"
          [ -n "$art" ] || { echo "geen artefact gevonden"; exit 1; }
          stop=$((SECONDS + 1500)); try=0
          while [ $SECONDS -lt $stop ]; do
            try=$((try + 1))
            oidc=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
            body=$(jq -n --argjson a "$art" --arg v "$GITHUB_SHA" --arg o "$oidc" '{artifact_id: $a, oidc_token: $o, pages_build_version: $v}')
            code=$(curl -sS -o "$RUNNER_TEMP/resp.json" -w "%{http_code}" -X POST "${H[@]}" "$API/pages/deployments" -d "$body")
            echo "=== $(date -u +%H:%M:%S) poging $try: HTTP $code"; cat "$RUNNER_TEMP/resp.json"; echo
            if [ "$code" != 200 ] && [ "$code" != 201 ]; then
              blk=$(jq -r '.message // ""' "$RUNNER_TEMP/resp.json" | sed -n 's/.*Please cancel \([^ ]*\) first.*/\1/p')
              [ -n "$blk" ] && curl -sS -X POST "${H[@]}" "$API/pages/deployments/$blk/cancel" -o /dev/null -w "blokkerende deploy $blk afbreken: HTTP %{http_code}\n"
              sleep 60; continue
            fi
            end=$((SECONDS + 900))
            while [ $SECONDS -lt $end ]; do
              st=$(curl -sS "${H[@]}" "$API/pages/deployments/$GITHUB_SHA" | jq -r '.status // ""')
              echo "$(date -u +%H:%M:%S) status: '$st'"
              case "$st" in
                succeed) echo "Gepubliceerd via de reserveweg"; exit 0 ;;
                deployment_cancelled) echo "De deploy van deze commit werd al afgebroken; een nieuwe wijziging (of lege commit) publiceert opnieuw."; exit 1 ;;
                deployment_failed|deployment_content_failed|deployment_lost|deployment_attempt_error) break ;;
              esac
              sleep 10
            done
            sleep 30
          done
          echo "Publiceren lukte niet binnen 25 minuten"; exit 1

      - name: Ruwe antwoorden van GitHub Pages
        if: always()
        run: |
          api() { curl -sS -i -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/$1"; echo; }
          echo "##### Verloop tijdens de deploy (pages/deployments/$GITHUB_SHA, elke 15 s)"
          cat "$RUNNER_TEMP/pages-raw.log" || echo "(geen logboek)"
          echo "##### Nu: pages/deployments/$GITHUB_SHA"; api "pages/deployments/$GITHUB_SHA"
          echo "##### Pages-instellingen (pages)"; api "pages"
          echo "##### Laatste builds (pages/builds?per_page=3)"; api "pages/builds?per_page=3"
          echo "##### Laatste deployments van github-pages"; api "deployments?environment=github-pages&per_page=3"
